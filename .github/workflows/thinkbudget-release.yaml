# Test builds of the thinking-budget branch, for people who want to try it
# without building Go themselves. Binaries only: the llama.cpp runtime this
# needs is b10091, which is exactly what stock 0.32.5 already ships, so a
# tester drops this binary over an existing install and keeps everything else.
#
# Deliberately uses no third-party actions — not actions/checkout, not
# setup-go, not upload-artifact. A fork whose policy is "local_only" blocks
# those and the run sits queued forever. git and gh are preinstalled on every
# hosted runner; go is preinstalled on the Linux and Windows images but not on
# the arm64 macOS one, so the build job fetches it from go.dev when it is
# missing rather than depending on anything it cannot see.
name: thinkbudget test build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or SHA to build
        default: thinkbudget-testing
        required: true
      version:
        description: version string stamped into the binary
        default: 0.32.5-thinkbudget
        required: true
      tag:
        description: release tag to create
        default: v0.32.5-thinkbudget
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GOTOOLCHAIN: auto

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: create the release
        working-directory: repo
        run: |
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ inputs.tag }}" \
            --target "$(git rev-parse HEAD)" \
            --title "ollama ${{ inputs.version }} — thinking budget test build" \
            --prerelease \
            --notes-file .github/workflows/thinkbudget-release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ollama-linux-amd64
            out: ollama
          - os: windows-latest
            asset: ollama-windows-amd64.exe
            out: ollama.exe
          - os: macos-latest
            asset: ollama-darwin-arm64
            out: ollama
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      # macos-latest (arm64) ships no Go: "go: command not found". Install the
      # current release into the runner temp and put it on PATH for the steps
      # that follow; GOTOOLCHAIN=auto then pulls whatever go.mod asks for.
      - name: ensure go
        run: |
          if command -v go > /dev/null; then go version; exit 0; fi
          case "$(uname -s)" in Darwin) os=darwin ;; *) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; *) arch=amd64 ;; esac
          ver=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -1)
          curl -fsSL "https://go.dev/dl/${ver}.${os}-${arch}.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: go version
        run: go version
      # -s -w is not optional: an unstripped cgo build produces a PE that
      # Windows refuses to load ("This app can't run on your PC").
      - name: build
        working-directory: repo
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X=github.com/ollama/ollama/version.Version=${{ inputs.version }} -X=github.com/ollama/ollama/server.mode=release" \
            -o "${{ matrix.out }}" .
          cp "${{ matrix.out }}" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"
      - name: smoke test
        working-directory: repo
        if: matrix.os != 'macos-latest'
        run: ./${{ matrix.out }} --version || true
      - name: attach to the release
        working-directory: repo
        run: gh release upload "${{ inputs.tag }}" "${{ matrix.asset }}" --clobber

  checksums:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: sha256
        working-directory: repo
        run: |
          mkdir -p dist && cd dist
          gh release download "${{ inputs.tag }}" --pattern 'ollama-*' --clobber
          sha256sum ollama-* > sha256sum.txt
          cat sha256sum.txt
          gh release upload "${{ inputs.tag }}" sha256sum.txt --clobber
