# Test builds of the thinking-budget branch, for people who want to try it
# without building it themselves.
#
# The Go binary alone used to be enough: the llama.cpp runtime the budget needed
# was b10091, exactly what stock 0.32.5 ships, so a tester dropped the binary
# over an existing install and kept everything else. That stopped being true
# when the budget sampler itself changed -- llama/compat now patches
# common/reasoning-budget.*, which compiles into lib/ollama, not into ollama.exe.
# Shipping only the binary would ship the half that asks for behaviour the
# runtime does not have, which looks exactly like the feature not working. So
# the runtime is built here too and attached as its own archive: on Windows
# with the MSYS2 clang64 toolchain the shipped DLLs are built with, and on
# Linux inside AlmaLinux 8 so it loads on the glibc the binary already targets.
#
# Deliberately uses no third-party actions — not actions/checkout, not
# setup-go, not upload-artifact. A fork whose policy is "local_only" blocks
# those and the run sits queued forever. git and gh are preinstalled on every
# hosted runner; go is preinstalled on the Linux and Windows images but not on
# the arm64 macOS one, so the build job fetches it from go.dev when it is
# missing rather than depending on anything it cannot see.
name: thinkbudget test build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or SHA to build
        default: thinkbudget-0.34.0
        required: true
      version:
        description: version string stamped into the binary
        default: 0.34.0-thinkbudget
        required: true
      tag:
        description: release tag to create
        default: v0.34.0-thinkbudget
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GOTOOLCHAIN: auto

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: create the release
        working-directory: repo
        run: |
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ inputs.tag }}" \
            --target "$(git rev-parse HEAD)" \
            --title "ollama ${{ inputs.version }} — thinking budget test build" \
            --prerelease \
            --notes-file .github/workflows/thinkbudget-release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ollama-linux-amd64
            out: ollama
            extldflags: ""
          - os: windows-latest
            asset: ollama-windows-amd64.exe
            out: ollama.exe
            # A cgo build on the runner links against the toolchain's mingw
            # runtime and imports libwinpthread-1.dll, which no clean Windows
            # install has: the binary dies at load with 0xC0000135
            # (STATUS_DLL_NOT_FOUND) before main() runs. It went unnoticed
            # because every machine it had been tried on -- the runner itself
            # included -- carries MSYS2. Link it in instead.
            extldflags: "-extldflags=-static"
          - os: macos-latest
            asset: ollama-darwin-arm64
            out: ollama
            # Not on darwin: the system libc is not available statically and
            # the link fails outright.
            extldflags: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      # macos-latest (arm64) ships no Go: "go: command not found". Install the
      # current release into the runner temp and put it on PATH for the steps
      # that follow; GOTOOLCHAIN=auto then pulls whatever go.mod asks for.
      - name: ensure go
        run: |
          if command -v go > /dev/null; then go version; exit 0; fi
          case "$(uname -s)" in Darwin) os=darwin ;; *) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; *) arch=amd64 ;; esac
          ver=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -1)
          curl -fsSL "https://go.dev/dl/${ver}.${os}-${arch}.tar.gz" -o "$RUNNER_TEMP/go.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: go version
        run: go version
      # ubuntu-latest is 24.04, so a cgo build there links against glibc 2.39
      # and the binary will not start on anything older than 2.34 — Ubuntu
      # 20.04, Debian 11, RHEL 8 all refuse it. Build the linux binary inside
      # AlmaLinux 8 (glibc 2.28) instead, which is what a tester on an older
      # distro needs; -ldl is required there because dlopen only moved into
      # libc proper in 2.34.
      - name: build (linux, inside almalinux 8)
        if: matrix.os == 'ubuntu-latest'
        working-directory: repo
        env:
          VERSION: ${{ inputs.version }}
          OUT: ${{ matrix.out }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION -e OUT \
            -e CGO_ENABLED=1 -e CGO_LDFLAGS=-ldl -e GOTOOLCHAIN=auto \
            almalinux:8 bash -euo pipefail -c '
              # gcc-c++ is not optional: the final link pulls in -lstdc++ and
              # plain gcc leaves it out ("cannot find -lstdc++").
              dnf install -y -q gcc gcc-c++ tar gzip findutils > /dev/null
              ver=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -1)
              curl -fsSL "https://go.dev/dl/${ver}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH=/usr/local/go/bin:$PATH
              go version
              go build -trimpath \
                -ldflags "-s -w -X=github.com/ollama/ollama/version.Version=$VERSION -X=github.com/ollama/ollama/server.mode=release" \
                -o "$OUT" .
            '
          sudo chown "$(id -u):$(id -g)" "$OUT"
          cp "$OUT" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"
          # prove the portability claim rather than assuming it
          objdump -T "${{ matrix.asset }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3 || true
      # -s -w is not optional: an unstripped cgo build produces a PE that
      # Windows refuses to load ("This app can't run on your PC").
      - name: build
        if: matrix.os != 'ubuntu-latest'
        working-directory: repo
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath \
            -ldflags "-s -w ${{ matrix.extldflags }} -X=github.com/ollama/ollama/version.Version=${{ inputs.version }} -X=github.com/ollama/ollama/server.mode=release" \
            -o "${{ matrix.out }}" .
          cp "${{ matrix.out }}" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"
      # The runner cannot smoke-test its way to this answer: it has the mingw
      # DLLs, so a binary that depends on them starts here and dies on a user's
      # machine. Read the import table instead. Anything outside the Windows
      # system set has to be absent from the file.
      - name: no third-party DLL imports
        if: matrix.os == 'windows-latest'
        working-directory: repo
        run: |
          bad=0
          for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll libgomp-1.dll; do
            if grep -qa "$dll" "${{ matrix.asset }}"; then
              echo "::error::${{ matrix.asset }} still references $dll; it will not load on a clean Windows install"
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "no third-party DLL references found"
          exit "$bad"
      - name: smoke test
        working-directory: repo
        if: matrix.os != 'macos-latest'
        run: ./${{ matrix.out }} --version || true
      - name: attach to the release
        working-directory: repo
        run: gh release upload "${{ inputs.tag }}" "${{ matrix.asset }}" --clobber

  # The half that carries the sampler. Only the base runtime is built: the patch
  # lives in libllama-common, and ggml-cuda talks to it through ggml's C ABI, so
  # a tester keeps the CUDA backend their install already has.
  windows-runtime:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        run: |
          # CRLF checkouts break the patch step: git apply will not match an LF
          # source with a CRLF patch, and llama/compat/*.patch are LF.
          git -c core.autocrlf=false -c core.eol=lf clone --depth 1 \
            --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: install the clang64 toolchain
        shell: pwsh
        run: |
          # The shipped DLLs are MSYS2 clang64 builds -- libc++.dll and
          # libunwind.dll in lib/ollama are the tell -- so match them rather
          # than building against the MSVC runtime.
          & C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-clang-x86_64-clang
          & C:\msys64\clang64\bin\clang.exe --version
      - name: build the runtime
        shell: pwsh
        working-directory: repo
        run: |
          # Native CMake and its bundled ninja: MSYS2's cmake takes POSIX paths
          # only, and its ninja links msys-2.0.dll.
          $cmakeDir = 'C:\Program Files\CMake\bin'
          $env:PATH = "$cmakeDir;C:\msys64\clang64\bin;$env:PATH"
          $env:CC  = 'C:/msys64/clang64/bin/clang.exe'
          $env:CXX = 'C:/msys64/clang64/bin/clang++.exe'
          $env:CMAKE_GENERATOR = 'Ninja'
          $dist = Join-Path $PWD 'dist'
          # GGML_CCACHE defaults on and picks up MSYS2's ccache, which cannot
          # resolve a Windows-path compiler and fails every compile.
          & cmake -S llama/server --preset cpu_windows -DGGML_CCACHE=OFF --install-prefix $dist
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

          # prove the compat patches reached the fetched source before compiling
          $rb = 'build/llama-server-cpu/_deps/llama_cpp-src/common/reasoning-budget.cpp'
          foreach ($needle in @('WAITING_BOUNDARY', 'REASONING_BUDGET_SCOPE_RESPONSE', 'forced_end_pos')) {
            if (-not (Select-String -Path $rb -Pattern $needle -Quiet)) { throw "compat patch did not bring $needle into $rb" }
            Write-Output "patch applied: $needle present"
          }

          & cmake --build build/llama-server-cpu --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & cmake --install build/llama-server-cpu --component llama-server --strip
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          Get-ChildItem dist/lib/ollama -File | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
      - name: package
        shell: pwsh
        working-directory: repo
        run: |
          Compress-Archive -Path dist/lib/ollama/* -DestinationPath ollama-windows-amd64-runtime.zip -Force
          Get-Item ollama-windows-amd64-runtime.zip | ForEach-Object { "{0:N1} MB" -f ($_.Length/1MB) }
      - name: attach to the release
        working-directory: repo
        run: gh release upload "${{ inputs.tag }}" ollama-windows-amd64-runtime.zip --clobber

  # The same half, for Linux, and for the same reason: without it a tester on
  # Linux has the binary asking for behaviour the runtime does not have, which
  # is indistinguishable from the feature not working. Built inside AlmaLinux 8
  # exactly as the binary is — a runner-native build links against glibc 2.39
  # and refuses to load on anything older than 2.34, which is most of what
  # people are actually running. Base runtime only: the patch lives in
  # libllama-common, and ggml-cuda, ggml-vulkan and the ROCm backend reach it
  # through ggml's C ABI, so an existing GPU install keeps working untouched.
  linux-runtime:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: build the runtime
        working-directory: repo
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 bash -euo pipefail -c '
            # gcc-toolset-12, not the stock gcc 8.5: GGML_CPU_ALL_VARIANTS
            # compiles the sapphirerapids variant with -mamx-tile, which no
            # compiler before gcc 11 recognises ("unrecognized command-line
            # option"). git is needed too — llama/compat applies its patches
            # with `git apply`.
            dnf install -y -q gcc-toolset-12 cmake git make tar gzip findutils > /dev/null
            source /opt/rh/gcc-toolset-12/enable
            # The presets ask for CMake 3.24. AlmaLinux 8 has carried 3.26
            # since 8.9, but fetch rather than fail a release on a base-image
            # change nobody here controls.
            have=$(cmake --version | head -1 | grep -oE "[0-9]+\.[0-9]+" | head -1)
            if [ "$(printf "%s\n3.24\n" "$have" | sort -V | head -1)" != "3.24" ]; then
              curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz -o /tmp/cmake.tgz
              tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tgz
            fi
            cmake --version
            cmake -S llama/server --preset cpu -DGGML_CCACHE=OFF --install-prefix /src/dist

            # prove the compat patches reached the fetched source before compiling
            rb=build/llama-server-cpu/_deps/llama_cpp-src/common/reasoning-budget.cpp
            for needle in WAITING_BOUNDARY REASONING_BUDGET_SCOPE_RESPONSE forced_end_pos; do
              grep -q "$needle" "$rb" || { echo "compat patch did not bring $needle into $rb"; exit 1; }
              echo "patch applied: $needle present"
            done

            cmake --build build/llama-server-cpu --parallel "$(nproc)"
            cmake --install build/llama-server-cpu --component llama-server --strip
          '
          # everything docker wrote is root-owned; the steps after this are not
          sudo chown -R "$(id -u):$(id -g)" dist build
          ls -la dist/lib/ollama
          # prove the portability claim rather than assuming it
          objdump -T dist/lib/ollama/libllama-common.so.* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3 || true
      - name: smoke test
        working-directory: repo
        run: ./dist/lib/ollama/llama-server --version || true
      - name: package
        working-directory: repo
        run: |
          # An `ollama/` directory at the archive root, so installing it is
          # `tar -C /usr/local/lib -xzf` over the directory it already has.
          tar -C dist/lib -czf ollama-linux-amd64-runtime.tgz ollama
          ls -la ollama-linux-amd64-runtime.tgz
      - name: attach to the release
        working-directory: repo
        run: gh release upload "${{ inputs.tag }}" ollama-linux-amd64-runtime.tgz --clobber

  checksums:
    needs: [build, windows-runtime, linux-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: clone
        run: git clone --depth 1 --branch "${{ inputs.ref }}" "https://github.com/${{ github.repository }}" repo
      - name: sha256
        working-directory: repo
        run: |
          mkdir -p dist && cd dist
          gh release download "${{ inputs.tag }}" --pattern 'ollama-*' --clobber
          sha256sum ollama-* > sha256sum.txt
          cat sha256sum.txt
          gh release upload "${{ inputs.tag }}" sha256sum.txt --clobber
